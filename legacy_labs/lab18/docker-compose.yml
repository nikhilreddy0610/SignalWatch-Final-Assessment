services:
  mongodb:
    image: mongo:7.0
    container_name: lab18-mongo
    restart: unless-stopped
    ports:
      - "27037:27017"
    environment:
      MONGO_INITDB_DATABASE: threat_intelligence
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  cassandra:
    image: cassandra:5.0
    container_name: lab18-cassandra
    restart: unless-stopped
    ports:
      - "9045:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20

  neo4j:
    image: neo4j:5.24
    container_name: lab18-neo4j
    restart: unless-stopped
    ports:
      - "7477:7474"
      - "7689:7687"
    environment:
      NEO4J_AUTH: neo4j/lab18pass
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p lab18pass 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20

  app:
    build: .
    container_name: lab18-app
    depends_on:
      mongodb:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: threat_intelligence
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_KEYSPACE: threat_intelligence
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: lab18pass
      THREAT_COUNT: '100000'
    volumes:
      - .:/app
    command: ["python", "-m", "app.main"]

volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
