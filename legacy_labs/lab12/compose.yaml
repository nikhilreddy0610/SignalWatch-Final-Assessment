services:
  mongo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${MONGO_PORT:-27020}:27017"
    environment:
      MONGO_ADMIN_USER: ${MONGO_ADMIN_USER:-lab_admin}
      MONGO_ADMIN_PASSWORD: ${MONGO_ADMIN_PASSWORD:-LabAdmin-ChangeMe-2026}
      APP_READ_USER: ${APP_READ_USER:-app_user_read}
      APP_READ_PASSWORD: ${APP_READ_PASSWORD:-ReadOnly-ChangeMe-2026}
      APP_WRITE_USER: ${APP_WRITE_USER:-app_user_write}
      APP_WRITE_PASSWORD: ${APP_WRITE_PASSWORD:-Writer-ChangeMe-2026}
      HR_USER: ${HR_USER:-hr_user}
      HR_PASSWORD: ${HR_PASSWORD:-HR-ChangeMe-2026}
    volumes:
      - mongo-data:/data/db
      - mongo-tls:/data/tls
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          "mongodb://localhost:27017/?tls=true&tlsCAFile=/data/tls/ca.crt&tlsCertificateKeyFile=/data/tls/client.pem&serverSelectionTimeoutMS=30000"
          --username "$${MONGO_ADMIN_USER}"
          --password "$${MONGO_ADMIN_PASSWORD}"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 90s

  tls-check:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile.verify
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo
      APP_READ_USER: ${APP_READ_USER:-app_user_read}
      APP_READ_PASSWORD: ${APP_READ_PASSWORD:-ReadOnly-ChangeMe-2026}
    volumes:
      - mongo-tls:/certs:ro

volumes:
  mongo-data:
  mongo-tls:
