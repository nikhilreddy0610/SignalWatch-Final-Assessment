version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: mongo-lab16
    restart: unless-stopped
    ports:
      - "27027:27017"
    environment:
      MONGO_INITDB_DATABASE: lab16
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  cassandra:
    image: cassandra:4.1
    container_name: cassandra-lab16
    restart: unless-stopped
    ports:
      - "9043:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q 'UN' || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 20

  neo4j:
    image: neo4j:5.15
    container_name: neo4j-lab16
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_dbms_default__listen__address: 0.0.0.0
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20

  app:
    build: .
    container_name: app-lab16
    depends_on:
      mongodb:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: lab16
      MONGO_COLLECTION: transactions
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: university_demo
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    command: sh -c "python -m app.seed_data && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
